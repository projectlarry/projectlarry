<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Projectlarry.lol</title>
<link rel="icon" href="../assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<section class="login" id="login"><div class="card col"><h2>Admin login</h2>
  <form id="lf"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus><button class="btn" type="submit">Enter</button></form>
  <div id="lmsg" style="color:var(--danger);font-size:.82rem;margin-top:8px"></div></div></section>
<div id="panel" hidden>
  <header class="ahead"><div class="abar">
    <a class="logo" href="../"><img src="../assets/img/logo.png" alt="" width="36" height="30">Admin</a>
    <nav class="tabs" id="atabs" role="tablist"></nav>
    <button class="btn ghost sm" id="logout" type="button">Log out</button>
  </div></header>
  <main class="amain">
    <section id="pane-subs">
      <div class="toolbar"><input class="grow" id="qs" type="search" placeholder="Search submissions by name or client"></div>
      <div id="subs"></div>
    </section>
    <section id="pane-lb" hidden>
      <div class="toolbar"><div class="tabs" id="ctabs"></div><input class="grow" id="ql" type="search" placeholder="Search the leaderboard"><button class="btn sm" id="addrun" type="button">Add run</button></div>
      <div id="board"></div>
    </section>
    <section id="pane-offers" hidden>
      <h2 class="sec-title">Pending offers</h2><div id="opend"></div>
      <h2 class="sec-title" style="margin-top:28px">Live offers</h2><div id="olive"></div>
    </section>
    <section id="pane-timers" hidden>
      <div class="toolbar"><button class="btn ghost sm" id="trefresh" type="button">Refresh</button><button class="btn ghost sm" id="treset" type="button">Reset all limits</button></div>
      <div id="tlist"></div>
    </section>
  </main>
</div>
<dialog id="formdlg"><h3 id="ftitle">Add a run</h3>
  <form id="f" class="dform">
    <label for="cat">Category</label><select id="cat"></select>
    <label for="n">Designer name</label><input id="n" required maxlength="40">
    <label for="t">Time</label><input id="t" placeholder="2:34:54 or 2h 34m 54s" required><div class="hint" id="tprev"></div>
    <label for="c">Client (optional)</label><input id="c" maxlength="60">
    <label for="v">Recording link (optional)</label><input id="v" placeholder="https://...">
    <label for="p">Card picture (optional)</label><input id="p" type="file" accept="image/*">
    <div id="msg"></div>
    <div class="row2"><button class="btn ghost" type="button" id="cx">Cancel</button><button class="btn" type="submit" id="sb">Add to list</button></div>
  </form>
</dialog>
<dialog id="dlg"><form method="dialog"><h3 id="dt"></h3><p class="dmsg" id="dm"></p>
  <div class="row2"><button class="btn ghost" value="cancel">Cancel</button><button class="btn red" id="dok" value="ok">OK</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="../js/admin-page.js"></script>
</body></html>
